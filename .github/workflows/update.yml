name: Update portfolio map

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 오전 6시 (한국시간) = 21:00 UTC
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths-ignore: ["data/history.json", "data/news.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install yfinance

      - name: Fetch prices
        run: python scripts/update.py

      - name: Fetch news
        run: python scripts/news.py || echo "news failed, keep previous"

      - name: Save history
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "시세 갱신 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -X theirs origin main || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
